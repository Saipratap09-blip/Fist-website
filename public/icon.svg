<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Tile with Safe Padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Envelope Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Envelope Body -->
    <rect x="96" y="148" width="320" height="224" rx="28" fill="url(#envGrad)"/>
    
    <!-- Top Flap Fold -->
    <path d="M96 176 L256 288 L416 176" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Bottom Left/Right Inner Folds -->
    <path d="M96 352 L220 252" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M416 352 L292 252" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>

    <!-- Letter peek inside -->
    <rect x="136" y="108" width="240" height="90" rx="14" fill="#FFFFFF" opacity="0.95"/>
    <rect x="160" y="132" width="130" height="10" rx="5" fill="#6366F1"/>
    <rect x="160" y="152" width="180" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="160" y="168" width="100" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <!-- Glowing AI Sparkles & Rocket Energy -->
  <g fill="url(#sparkGrad)" filter="url(#shadow)">
    <!-- Primary Big Sparkle -->
    <path d="M370 120 C370 140 384 154 404 154 C384 154 370 168 370 188 C370 168 356 154 336 154 C356 154 370 140 370 120 Z"/>
    <!-- Small Sparkle -->
    <path d="M130 190 C130 202 138 210 150 210 C138 210 130 218 130 230 C130 218 122 210 110 210 C122 210 130 202 130 190 Z"/>
    <!-- Tiny Star -->
    <circle cx="396" cy="230" r="8" fill="#FDE047"/>
  </g>

  <!-- Conversion Pulse Chart Line on Letter -->
  <path d="M152 320 L210 280 L260 306 L330 220 L360 234" stroke="#4F46E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="330" cy="220" r="6" fill="#EC4899"/>
</svg>
